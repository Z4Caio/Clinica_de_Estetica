<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="goldNavBeauty" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4D0B4" />
      <stop offset="50%" stop-color="#C9A06C" />
      <stop offset="100%" stop-color="#8B6A4A" />
    </linearGradient>
  </defs>

  <!-- Simbolo Diamante Retilíneo na Esquerda -->
  <g transform="translate(35, 40) scale(0.45)">
    <polygon points="0,-45 38,0 0,45 -38,0" fill="none" stroke="url(#goldNavBeauty)" stroke-width="2" />
    <line x1="-20" y1="0" x2="20" y2="0" stroke="url(#goldNavBeauty)" stroke-width="1.5" />
    <line x1="0" y1="-25" x2="0" y2="25" stroke="url(#goldNavBeauty)" stroke-width="1.5" />
    <circle cx="0" cy="0" r="3" fill="url(#goldNavBeauty)" />
  </g>

  <!-- Nome da Marca na Direita -->
  <text x="80" y="44" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="500" fill="url(#goldNavBeauty)" letter-spacing="4">
    ÉLÉGANCE
  </text>
  <text x="81" y="58" font-family="'Outfit', sans-serif" font-size="8" font-weight="400" fill="#E4D0B4" letter-spacing="3" opacity="0.85">
    ESTÉTICA AVANÇADA
  </text>
</svg>
